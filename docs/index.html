<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動運転 教材集</title>
<meta name="description" content="自動運転の制御・経路追従を、ブラウザ上で動かして学ぶ教材集です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --card:#fafbfa; --ink:#1c2826; --sub:#5d6b68; --line:#d8dfdb; --accent:#1f9e86; --chip:#e6ebe8;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141a19; --card:#1c2422; --ink:#e4ebe8; --sub:#93a29e; --line:#2c3735; --accent:#3cc4a8; --chip:#26302e;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.7}
main{max-width:720px; margin:0 auto; padding:48px 16px 64px}
h1{font-size:1.6rem; margin:0 0 8px}
.lead{color:var(--sub); margin:0 0 32px}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.card{display:block; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
.card h2{font-size:1.1rem; margin:0 0 4px}
.card p{margin:0; color:var(--sub); font-size:.92rem}
.tag{display:inline-block; margin-top:10px; padding:1px 8px; background:var(--chip); border-radius:999px; font-family:var(--mono); font-size:.75rem; color:var(--sub)}
footer{margin-top:40px; color:var(--sub); font-size:.85rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>自動運転 教材集</h1>
  <p class="lead">自動運転の制御・経路追従を、ブラウザ上で動かして学ぶ教材です。インストール不要で、PC・スマホのどちらでも開けます。</p>

  <ul>
    <li>
      <a class="card" href="pp-mpc-lab/">
        <h2>PP / MPC 経路追従ラボ</h2>
        <p>Pure Pursuit と MPC（モデル予測制御）の違いを、上から見た走行画面で見比べます。パラメータを変えるとハンドルの切り方がどう変わるかを確認できます。</p>
        <span class="tag">経路追従</span> <span class="tag">Pure Pursuit</span> <span class="tag">MPC</span>
      </a>
    </li>
  </ul>

  <footer>
    ソース: <a href="https://github.com/tamasy/AutonomousDriving">tamasy/AutonomousDriving</a>
  </footer>
</main>
</body>
</html>
